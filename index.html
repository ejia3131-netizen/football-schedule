<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>足球赛程信号源</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  :root {
    --ground: #F2F5F1;
    --surface: #FFFFFF;
    --ink: #15201A;
    --muted: #5B6A61;
    --line: #DCE3DD;
    --accent: #0B7A55;
    --accent-soft: #E1F0E8;
    --ok: #137A3F;
    --ok-bg: #DDF3E4;
    --wait: #A1500A;
    --wait-bg: #FCEBD7;
    --none: #7A857F;
    --live: #D0301F;
    --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --font-num: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0D1411; --surface: #151F1A; --ink: #E6EEE9; --muted: #91A298; --line: #26342D;
      --accent: #43C08D; --accent-soft: #173327; --ok: #5FD38D; --ok-bg: #16362A;
      --wait: #F0A55A; --wait-bg: #3A2814; --none: #7F8D86; --live: #FF6B5A;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0D1411; --surface: #151F1A; --ink: #E6EEE9; --muted: #91A298; --line: #26342D;
    --accent: #43C08D; --accent-soft: #173327; --ok: #5FD38D; --ok-bg: #16362A;
    --wait: #F0A55A; --wait-bg: #3A2814; --none: #7F8D86; --live: #FF6B5A;
  }

  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
  .wrap { max-width: 920px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }

  header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; }
  h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: 0.01em; text-wrap: balance; }
  .meta { color: var(--muted); font-size: 13px; }
  .meta b { font-family: var(--font-num); font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: 0.02em; }

  .summary { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .summary span { display: inline-flex; align-items: center; gap: 6px; }
  .summary .n { font-family: var(--font-num); font-size: 18px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }

  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--ground); margin-top: 18px; padding-block: 10px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--ground); }
  .chip:focus-visible, .toggle input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip .c { font-family: var(--font-num); font-weight: 600; margin-left: 4px; opacity: 0.7; }
  .toggle { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

  .day { margin-top: 28px; }
  .day h2 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px; font-size: 14px; font-weight: 500; color: var(--muted); }
  .day h2 .date { font-family: var(--font-num); font-size: 24px; font-weight: 700; color: var(--ink); letter-spacing: 0.02em; }
  .day h2 .today { font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 1px 8px; border-radius: 4px; }
  .list { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }

  .row { display: grid; grid-template-columns: 64px minmax(0, 1fr) 96px 88px; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row.done { color: var(--muted); }
  .time { font-family: var(--font-num); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .comp { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 8px; }
  .comp .cat { color: var(--accent); font-weight: 500; }
  .teams { font-weight: 500; overflow-wrap: anywhere; }
  .teams a { color: inherit; text-decoration: none; }
  .teams a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .teams .vs { color: var(--muted); font-weight: 400; margin-inline: 6px; font-size: 13px; }
  .state { font-family: var(--font-num); font-size: 18px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; }
  .state.live { color: var(--live); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .state .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: pulse 1.6s ease-in-out infinite; }
  .state .ft { font-family: var(--font-body); font-size: 11px; color: var(--muted); margin-left: 4px; }
  .state .dash { color: var(--line); }
  @keyframes pulse { 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) { .state .dot { animation: none; } }

  .link { justify-self: end; font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 4px; white-space: nowrap; }
  .link.ok { color: var(--ok); background: var(--ok-bg); }
  .link.wait { color: var(--wait); background: var(--wait-bg); }
  .link.none { color: var(--none); border: 1px dashed var(--line); }

  .empty { margin-top: 32px; padding: 32px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; }
  .foot { margin-top: 32px; font-size: 12px; color: var(--muted); max-width: 65ch; }

  @media (max-width: 600px) {
    h1 { font-size: 23px; }
    .toggle { margin-left: 0; }
    .row { grid-template-columns: 52px minmax(0, 1fr) auto; grid-template-areas: "time main state" "time main link"; row-gap: 4px; padding: 12px; }
    .time { grid-area: time; font-size: 19px; align-self: start; }
    .main { grid-area: main; }
    .state { grid-area: state; text-align: right; font-size: 16px; }
    .state.live { justify-content: flex-end; }
    .link { grid-area: link; }
  }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>足球赛程 · 信号源</h1>
      <div class="meta" id="updated"></div>
    </div>
  </header>
  <div class="summary" id="summary"></div>

  <nav class="bar" aria-label="筛选">
    <div id="chips" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    <label class="toggle"><input type="checkbox" id="only-linked"> 只看有信号源</label>
  </nav>

  <main id="days"></main>

  <p class="foot">赛程来自 Flashscore，只包括英超、欧冠、马来西亚所有联赛，以及有马来西亚球队参加的比赛。信号源状态来自 PandaScore，网站一般只在开赛前几小时才列出比赛，所以较晚的比赛会先显示「未列出」。时间按你设备的时区显示。</p>
</div>

<script>
const DATA = {"matches": [{"id": "jTnIKqKc", "start": 1789563600, "category": "马来西亚联赛", "country": "Malaysia", "competition": "FA Cup", "home": "Terengganu", "away": "DPMM", "state": "scheduled", "scoreHome": null, "scoreAway": null, "url": "https://www.flashscore.com/match/jTnIKqKc/", "linkStatus": null, "linkCheckedAt": null}, {"id": "ObA4gvV1", "start": 1789758000, "category": "英超", "country": "England", "competition": "Premier League", "home": "Brentford", "away": "Chelsea", "state": "scheduled", "scoreHome": null, "scoreAway": null, "url": "https://www.flashscore.com/match/ObA4gvV1/", "linkStatus": null, "linkCheckedAt": null}, {"id": "4Sl9Mxal", "start": 1789817400, "category": "英超", "country": "England", "competition": "Premier League", "home": "Tottenham", "away": "Aston Villa", "state": "scheduled", "scoreHome": null, "scoreAway": null, "url": "https://www.flashscore.com/match/4Sl9Mxal/", "linkStatus": null, "linkCheckedAt": null}, {"id": "WIpYn8Jq", "start": 1789822800, "category": "马来西亚联赛", "country": "Malaysia", "competition": "FA Cup", "home": "Star City", "away": "Selangor", "state": "scheduled", "scoreHome": null, "scoreAway": null, "url": "https://www.flashscore.com/match/WIpYn8Jq/", "linkStatus": null, "linkCheckedAt": null}, {"id": "j52jHsN8", "start": 1789826400, "category": "英超", "country": "England", "competition": "Premier League", "home": "Brighton", "away": "Arsenal", "state": "scheduled", "scoreHome": null, "scoreAway": null, "url": "https://www.flashscore.com/match/j52jHsN8/", "linkStatus": null, "linkCheckedAt": null}, {"id": "rDKcFLiL", "start": 1789826400, "category": "英超", "country": "England", "competition": "Premier League", "home": "Everton", "away": "Ipswich", "state": "scheduled", "scoreHome": null, "scoreAway": null, "url": "https://www.flashscore.com/match/rDKcFLiL/", "linkStatus": null, "linkCheckedAt": null}, {"id": "nTaVTK6E", "start": 1789826400, "category": "英超", "country": "England", "competition": "Premier League", "home": "Newcastle", "away": "Hull", "state": "scheduled", "scoreHome": null, "scoreAway": null, "url": "https://www.flashscore.com/match/nTaVTK6E/", "linkStatus": null, "linkCheckedAt": null}, {"id": "YqbwSbyR", "start": 1789835400, "category": "英超", "country": "England", "competition": "Premier League", "home": "Nottingham", "away": "Coventry", "state": "scheduled", "scoreHome": null, "scoreAway": null, "url": "https://www.flashscore.com/match/YqbwSbyR/", "linkStatus": null, "linkCheckedAt": null}, {"id": "UB9wJWlg", "start": 1789894800, "category": "马来西亚联赛", "country": "Malaysia", "competition": "FA Cup", "home": "Penang", "away": "Johor DT", "state": "scheduled", "scoreHome": null, "scoreAway": null, "url": "https://www.flashscore.com/match/UB9wJWlg/", "linkStatus": null, "linkCheckedAt": null}, {"id": "8jfSVUpd", "start": 1789909200, "category": "马来西亚联赛", "country": "Malaysia", "competition": "FA Cup", "home": "Kelantan City", "away": "Kuching City FC", "state": "scheduled", "scoreHome": null, "scoreAway": null, "url": "https://www.flashscore.com/match/8jfSVUpd/", "linkStatus": null, "linkCheckedAt": null}, {"id": "joCde00k", "start": 1789909200, "category": "英超", "country": "England", "competition": "Premier League", "home": "Bournemouth", "away": "Liverpool", "state": "scheduled", "scoreHome": null, "scoreAway": null, "url": "https://www.flashscore.com/match/joCde00k/", "linkStatus": null, "linkCheckedAt": null}, {"id": "n99y8wpe", "start": 1789909200, "category": "英超", "country": "England", "competition": "Premier League", "home": "Leeds", "away": "Crystal Palace", "state": "scheduled", "scoreHome": null, "scoreAway": null, "url": "https://www.flashscore.com/match/n99y8wpe/", "linkStatus": null, "linkCheckedAt": null}, {"id": "fZCq6HE7", "start": 1789909200, "category": "英超", "country": "England", "competition": "Premier League", "home": "Manchester City", "away": "Sunderland", "state": "scheduled", "scoreHome": null, "scoreAway": null, "url": "https://www.flashscore.com/match/fZCq6HE7/", "linkStatus": null, "linkCheckedAt": null}, {"id": "vq6T9aFr", "start": 1789918200, "category": "英超", "country": "England", "competition": "Premier League", "home": "Fulham", "away": "Manchester Utd", "state": "scheduled", "scoreHome": null, "scoreAway": null, "url": "https://www.flashscore.com/match/vq6T9aFr/", "linkStatus": null, "linkCheckedAt": null}], "generatedAt": 1789561086};
const CATS = ["英超", "欧冠", "马来西亚联赛", "马来西亚球队"];
const LINK = { "已生成": ["ok", "已生成"], "未生成": ["wait", "未生成"] };
const WEEK = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];

let filter = "全部";
let onlyLinked = false;
try {
  filter = localStorage.getItem("fs-filter") || "全部";
  onlyLinked = localStorage.getItem("fs-linked") === "1";
} catch (e) {}

const pad = n => String(n).padStart(2, "0");
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function tzLabel() {
  const off = -new Date().getTimezoneOffset() / 60;
  return `GMT${off >= 0 ? "+" : ""}${off}`;
}

function render() {
  const matches = (DATA && DATA.matches) || [];
  const gen = DATA ? new Date(DATA.generatedAt * 1000) : null;
  document.getElementById("updated").innerHTML = gen
    ? `更新于 <b>${gen.getMonth() + 1}月${gen.getDate()}日 ${hm(gen)}</b> · 时区 ${tzLabel()}`
    : "暂无数据";

  const todayKey = dayKey(new Date());
  const visible = matches.filter(m => dayKey(new Date(m.start * 1000)) >= todayKey || m.state === "live");

  const count = s => visible.filter(m => m.linkStatus === s).length;
  document.getElementById("summary").innerHTML = `
    <span><span class="n">${visible.length}</span>场比赛</span>
    <span><span class="n">${visible.filter(m => m.state === "live").length}</span>进行中</span>
    <span><span class="n">${count("已生成")}</span>已生成</span>
    <span><span class="n">${count("未生成")}</span>未生成</span>`;

  const chips = document.getElementById("chips");
  chips.innerHTML = ["全部", ...CATS].map(c => {
    const n = c === "全部" ? visible.length : visible.filter(m => m.category === c).length;
    return `<button class="chip" type="button" id="chip-${c}" data-cat="${c}" aria-pressed="${c === filter}">${c}<span class="c">${n}</span></button>`;
  }).join("");
  document.getElementById("only-linked").checked = onlyLinked;

  const shown = visible.filter(m => (filter === "全部" || m.category === filter) && (!onlyLinked || m.linkStatus));
  const groups = new Map();
  for (const m of shown) {
    const d = new Date(m.start * 1000);
    const k = dayKey(d);
    if (!groups.has(k)) groups.set(k, { date: d, rows: [] });
    groups.get(k).rows.push(m);
  }

  const days = document.getElementById("days");
  if (!shown.length) {
    days.innerHTML = `<div class="empty">${onlyLinked ? "目前没有带信号源的比赛。取消「只看有信号源」可以查看完整赛程。" : "这个分类未来几天没有比赛。"}</div>`;
    return;
  }
  days.innerHTML = [...groups.entries()].map(([k, g]) => `
    <section class="day">
      <h2><span class="date">${g.date.getMonth() + 1}月${g.date.getDate()}日</span>${WEEK[g.date.getDay()]}${k === todayKey ? '<span class="today">今天</span>' : ""}</h2>
      <div class="list">${g.rows.map(row).join("")}</div>
    </section>`).join("");
}

function row(m) {
  const d = new Date(m.start * 1000);
  const hasScore = m.scoreHome != null && m.scoreAway != null;
  let state = '<span class="dash">—</span>';
  if (m.state === "live") state = `<span class="dot"></span>${hasScore ? `${esc(m.scoreHome)}–${esc(m.scoreAway)}` : "LIVE"}`;
  else if (m.state === "finished" && hasScore) state = `${esc(m.scoreHome)}–${esc(m.scoreAway)}<span class="ft">完场</span>`;
  const [cls, label] = LINK[m.linkStatus] || ["none", "未列出"];
  return `
    <div class="row${m.state === "finished" ? " done" : ""}">
      <div class="time">${hm(d)}</div>
      <div class="main">
        <div class="comp"><span class="cat">${esc(m.category)}</span><span>${esc(m.country)} · ${esc(m.competition)}</span></div>
        <div class="teams"><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.home)}<span class="vs">vs</span>${esc(m.away)}</a></div>
      </div>
      <div class="state${m.state === "live" ? " live" : ""}">${state}</div>
      <div class="link ${cls}" title="${m.linkCheckedAt ? "最后检查 " + hm(new Date(m.linkCheckedAt * 1000)) : "PandaScore 尚未列出这场比赛"}">${label}</div>
    </div>`;
}

document.getElementById("chips").addEventListener("click", e => {
  const b = e.target.closest("button[data-cat]");
  if (!b) return;
  filter = b.dataset.cat;
  try { localStorage.setItem("fs-filter", filter); } catch (e) {}
  render();
});
document.getElementById("only-linked").addEventListener("change", e => {
  onlyLinked = e.target.checked;
  try { localStorage.setItem("fs-linked", onlyLinked ? "1" : "0"); } catch (e) {}
  render();
});

render();
</script>
